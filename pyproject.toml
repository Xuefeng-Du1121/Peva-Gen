[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peva-gen"
version = "0.1.0"
description = "Physics- and evidence-value-aligned multi-UAV maritime search"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "netCDF4>=1.6,<2",
  "torch>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
